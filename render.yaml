services:
  - type: web
    name: gambit-engine
    env: python
    rootDir: chess-engine
    buildCommand: "apt-get update && apt-get install -y stockfish && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: STOCKFISH_POOL_SIZE
        value: "2"
      - key: STOCKFISH_PATH
        value: "/usr/bin/stockfish"
      - key: SUPABASE_URL
        sync: false
      # Secret key (sb_secret_...). The legacy SUPABASE_SERVICE_KEY is still read as a fallback.
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Shared secret for X-Engine-Key; set the same value on Railway and Vercel.
      - key: ENGINE_SHARED_SECRET
        sync: false
