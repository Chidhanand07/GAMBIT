services:
  - type: web
    name: gambit-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Shared secret for X-Engine-Key; set the same value on Railway and Vercel.
      - key: ENGINE_SHARED_SECRET
        sync: false
