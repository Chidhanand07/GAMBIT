# Ruff lint + format for the chess engine (docs/ENGINEERING_RULES.md GIT-09).
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "venv"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "C90"]

[lint.mccabe]
max-complexity = 10  # SIZE-03

# Legacy baseline: pre-existing findings, allowed until PR 17 restructures the
# engine. The list may only shrink (same ratchet policy as the JS packages).
[lint.per-file-ignores]
"main.py" = ["B904", "E501", "F401", "I001"]
"engine.py" = ["C901", "E402", "I001"]
"computer_engine.py" = ["B904", "I001"]
"style_engine.py" = ["B904", "B905", "I001"]
"tests/conftest.py" = ["I001"]
"tests/test_engine.py" = ["F401", "I001"]
"tests/test_scoring.py" = ["I001"]
