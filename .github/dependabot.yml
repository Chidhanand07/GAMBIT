# Dependabot version updates (GIT-06, SEC-11).
#
# - PRs target `preprod`, never `main` (the repo's integration branch).
#   Caveat: `target-branch` applies to these scheduled version updates only. Dependabot *security*
#   updates ignore it and always open against the default branch; retarget those PRs to `preprod`.
# - Minor and patch updates arrive as ONE grouped PR per ecosystem entry; every major update gets
#   its own PR, because majors need a human to read the changelog.
# - `open-pull-requests-limit` counts version-update PRs per entry (security updates have their own limit).
# - Nothing here merges on its own: every PR goes through the required checks and a review.
#
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: npm
    directory: /server
    target-branch: preprod
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, server]
    groups:
      server-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: preprod
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, frontend]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  # Reads requirements.txt and requirements-dev.txt. Unpinned lines (torch, numpy) have no version
  # to bump, so Dependabot leaves them alone.
  - package-ecosystem: pip
    directory: /chess-engine
    target-branch: preprod
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, chess-engine]
    groups:
      engine-minor-patch:
        update-types: [minor, patch]

  # `/` means .github/workflows for this ecosystem.
  - package-ecosystem: github-actions
    directory: /
    target-branch: preprod
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    labels: [dependencies, ci]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
