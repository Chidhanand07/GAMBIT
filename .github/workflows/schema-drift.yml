name: Schema drift

# SEC-08 / GIT-08: fail when the hosted Supabase schema no longer matches supabase/migrations
# (somebody changed the remote by hand, or a merged migration was never applied).
# Read-only: scripts/schema-drift.sh links, lists the migration history and diffs. It never pushes.
#
# Not a PR check on purpose: it needs repository secrets, which fork PRs do not get, and the drift
# it detects is not caused by the PR. Do NOT add it to the required checks of a ruleset.
#
# Secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   database password of the project
#   SUPABASE_PROJECT_REF   project ref (the id in the project URL)
# Until all three exist the job passes with a notice and checks nothing.
#
# UNVERIFIED: this workflow has never run. CLI flags follow the v3.1.0 reference (see the script).

on:
  schedule:
    # Daily 04:23 UTC, on the default branch.
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: schema-drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drift:
    name: Schema drift (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      # `secrets` cannot be used in a job-level `if`, so a step decides. Only presence is tested.
      - name: Check that the Supabase secrets are configured
        id: secrets
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          [ -n "$SUPABASE_PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::notice title=Schema drift check skipped::Missing repository secrets:$missing. Nothing was compared."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.configured == 'true'
      - uses: supabase/setup-cli@v3
        if: steps.secrets.outputs.configured == 'true'
        with:
          version: latest
      - name: Compare the linked project with supabase/migrations
        if: steps.secrets.outputs.configured == 'true'
        run: scripts/schema-drift.sh
