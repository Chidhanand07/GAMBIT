name: Tests

on:
  push:
    branches: [main, preprod]
  # No branch filter: runs for PRs into any base, including stacked refactor/* branches (TEST-01).
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Lint (ESLint, legacy files as warnings)
        run: npm run lint
      - name: Architecture (dependency-cruiser)
        run: npm run lint:arch
      - name: Formatting (Prettier, refactored paths)
        run: npm run format:check
      - name: Legacy baseline ratchet
        env:
          PR_BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$PR_BASE" ]; then
            git fetch --no-tags --depth=1 origin "$PR_BASE"
            export BASE_REF="origin/$PR_BASE"
          fi
          npm run lint:baseline
      - run: npx jest --ci

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check (NX-14)
        run: npm run typecheck
      - name: Lint (ESLint, legacy files as warnings)
        run: npm run lint
      - name: Formatting (Prettier, refactored paths)
        run: npm run format:check
      - name: Legacy baseline ratchet
        env:
          PR_BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$PR_BASE" ]; then
            git fetch --no-tags --depth=1 origin "$PR_BASE"
            export BASE_REF="origin/$PR_BASE"
          fi
          npm run lint:baseline
      - run: npx jest --ci

  engine:
    name: Chess engine (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: chess-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: chess-engine/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (Ruff, GIT-09)
        run: ruff check .
      - name: Formatting (Ruff)
        run: ruff format --check .
      # Tests fake Stockfish; no binary is installed on purpose.
      - run: python -m pytest -q

  database:
    name: Database (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Local Supabase stack (Postgres + Auth schema + API roles) in Docker.
      - name: Start Supabase
        run: supabase start
      # Rebuild the database from supabase/migrations, from scratch (SEC-08).
      - name: Apply every migration to an empty database
        run: supabase db reset
      # pgTAP: RLS, column privileges and schema guards (TEST-04), supabase/tests/*.sql.
      - name: Database tests (pgTAP)
        run: supabase test db
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
