name: Dependency audit

# SEC-11: fail on known-vulnerable production dependencies unless an exception is approved in
# .github/dependency-audit-allowlist.json (format and rules: scripts/dependency-audit.js).
#   server, frontend: npm audit --omit=dev --audit-level=high   -> fails on high/critical
#   chess-engine:     pip-audit -r requirements.txt             -> fails on ANY known vulnerability
#                     (pip-audit reports no severity, so there is nothing honest to filter on)
# A separate workflow rather than a job in tests.yml because it also runs on a schedule: an advisory
# published after the last merge must turn up without waiting for someone to open a PR.

on:
  push:
    branches: [main, preprod]
  # No branch filter and no path filter: a required check has to report on every PR.
  pull_request:
  schedule:
    # Mondays 05:47 UTC, on the default branch.
    - cron: '47 5 * * 1'
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned: an unpinned audit tool is itself a supply-chain input. Nothing updates this pin automatically,
  # so bump it by hand.
  PIP_AUDIT_VERSION: '2.10.1'

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # No `npm ci`: npm audits the committed lockfiles, and the script uses Node built-ins only.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: chess-engine/requirements.txt
      - name: Audit script self-test and allow-list validation
        run: |
          node --test scripts/dependency-audit.test.js
          node scripts/dependency-audit.js check-allowlist
      # Each audit runs even when an earlier one failed, so one run lists every finding.
      - name: Server (npm audit, high/critical)
        if: ${{ !cancelled() }}
        run: node scripts/dependency-audit.js npm server
      - name: Frontend (npm audit, high/critical)
        if: ${{ !cancelled() }}
        run: node scripts/dependency-audit.js npm frontend
      - name: Install pip-audit
        if: ${{ !cancelled() }}
        run: pip install "pip-audit==${PIP_AUDIT_VERSION}"
      # pip-audit resolves requirements.txt in a throwaway virtualenv (this downloads the CPU torch wheel).
      - name: Chess engine (pip-audit, any known vulnerability)
        if: ${{ !cancelled() }}
        run: node scripts/dependency-audit.js pip chess-engine
